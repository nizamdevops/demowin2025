##CID-##:Ensure IPv6 is disabled on windows"
---
- name: Disable IPv6 on Windows Hosts
  hosts: all
  gather_facts: no
  tasks:
    - name: Disable IPv6
      win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip6\Parameters
        name: DisabledComponents
        data: 0xff
        type: dword


##CID-##:Ensure to disable SMBv1"
       
- name: Disable SMBv1 via registry (all Windows versions)
  hosts: all
  gather_facts: no
  tasks:
    - name: Disable SMBv1
      win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters
        name: SMB1
        data: 0
        type: dword
      
      
- name: Disable SMBv1 via registry (all Windows versions)
  hosts: all
  gather_facts: no
  tasks:
    - name: Disable SMBv1
      win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Services\LanmanWorkstation\Parameters
        name: SMB1
        data: 0
        type: dword

  - name: Disable SMB 1.x MiniRedirector service
  hosts: all
  gather_facts: no
  tasks:
    - name: Ensure SMB 1.x MiniRedirector service is disabled
      ansible.windows.win_service:
        name: mrxsmb10
        start_mode: disabled
        state: stopped
      register: service_result
